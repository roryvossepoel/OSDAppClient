name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Expected release version, for example 0.29.1. Leave empty to use ModuleVersion.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:SOURCE_REF -ne 'main') {
              throw "GitHub releases must be created from the main branch. Current ref: '$env:SOURCE_REF'."
          }

          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:SOURCE_SHA) {
              throw "Release source '$env:SOURCE_SHA' is not the current origin/main commit '$remoteMain'."
          }

          Write-Host "Release source matches origin/main: $env:SOURCE_SHA"

      - name: Resolve and validate version
        id: release
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Test-ModuleManifest ./OSDApps.psd1 -ErrorAction Stop
          $moduleVersion = $manifest.Version.ToString()
          $expectedVersion = [string]$env:EXPECTED_VERSION

          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
              $expectedVersion = $moduleVersion
          }

          $expectedVersion = $expectedVersion.Trim() -replace '^v',''

          if ($expectedVersion -ne $moduleVersion) {
              throw "Expected version '$expectedVersion' does not match ModuleVersion '$moduleVersion'."
          }

          $tag = "v$expectedVersion"

          "release_version=$expectedVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Resolved release: $tag"

      - name: Check existing tag and release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch --tags --force
          $tagExists = -not [string]::IsNullOrWhiteSpace((git tag --list $env:TAG))
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($tagExists) {
              $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
              if ($tagCommit -ne $env:GITHUB_SHA) {
                  throw "Tag '$env:TAG' already exists at commit '$tagCommit' instead of current release commit '$env:GITHUB_SHA'."
              }

              Write-Host "Tag '$env:TAG' already exists at the expected commit."
          }
          else {
              Write-Host "Tag '$env:TAG' does not exist yet."
          }

          $releaseExists = $false
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
              $releaseExists = $true
              Write-Host "GitHub release '$env:TAG' already exists. Treating this workflow run as an idempotent success."
          }

          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install validation dependencies
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate release candidate
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        run: |
          ./build/Test-Module.ps1

      - name: Create GitHub release
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        run: |
          $ErrorActionPreference = 'Stop'

          $arguments = @(
              'release', 'create', $env:TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "OSDApps v$env:RELEASE_VERSION",
              '--generate-notes'
          )

          if ($env:TAG_EXISTS -eq 'true') {
              $arguments += '--verify-tag'
          }
          else {
              $arguments += @('--target', $env:GITHUB_SHA)
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Created GitHub release $env:TAG."
