<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">OSDApps repository contract</title><desc id="desc">A self-maintained static repository consists of catalog.json, package manifests and Package.zip files containing Package/Install.ps1 and payload.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.sh{font-size:20px;font-weight:700}.t{font-size:16px;font-weight:600}.s{font-size:14px}.mono{font-size:14px;font-family:Consolas,monospace}.box{fill:#fff;stroke:#9fb1c8;stroke-width:2}.repo{fill:#f4f7fb;stroke:#6b83a3;stroke-width:2}.accent{fill:#233b5f}.white{fill:#fff;font-size:16px;font-weight:700}.arrow{stroke:#4a5a73;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a5a73"/></marker></defs>
<text x="600" y="42" text-anchor="middle" class="h">Self-maintained repository contract</text>
<rect x="70" y="85" width="1060" height="52" rx="10" class="accent"/><text x="600" y="118" text-anchor="middle" class="white">You own the repository, versions, packages and publishing lifecycle</text>
<rect x="80" y="180" width="280" height="110" rx="12" class="repo"/><text x="220" y="215" text-anchor="middle" class="sh">catalog.json</text><text x="220" y="248" text-anchor="middle" class="s">Application index</text><text x="220" y="272" text-anchor="middle" class="s">Points to package manifests</text>
<rect x="460" y="180" width="280" height="145" rx="12" class="box"/><text x="600" y="215" text-anchor="middle" class="sh">manifest.json</text><text x="600" y="247" text-anchor="middle" class="s">Id · DisplayName · Version</text><text x="600" y="272" text-anchor="middle" class="s">Architecture · SuccessCodes</text><text x="600" y="297" text-anchor="middle" class="s">Archive.FileName · SHA256</text>
<rect x="840" y="180" width="280" height="145" rx="12" class="repo"/><text x="980" y="215" text-anchor="middle" class="sh">Package.zip</text><text x="980" y="247" text-anchor="middle" class="mono">Package/</text><text x="980" y="272" text-anchor="middle" class="mono">├─ Install.ps1</text><text x="980" y="297" text-anchor="middle" class="mono">└─ payload</text>
<path d="M360 235 H460" class="arrow"/><path d="M740 252 H840" class="arrow"/>
<text x="410" y="220" text-anchor="middle" class="s">references</text><text x="790" y="237" text-anchor="middle" class="s">validates SHA256</text>
<rect x="220" y="390" width="760" height="165" rx="14" class="box"/>
<text x="600" y="425" text-anchor="middle" class="sh">Published static structure</text>
<text x="285" y="460" class="mono">Repository/</text><text x="315" y="486" class="mono">├─ catalog.json</text><text x="315" y="512" class="mono">└─ Apps/&lt;Id&gt;/&lt;Version&gt;/&lt;Architecture&gt;/</text><text x="355" y="538" class="mono">├─ manifest.json</text><text x="355" y="564" class="mono">└─ Package.zip</text>
<text x="600" y="615" text-anchor="middle" class="s">Host on any HTTP/HTTPS endpoint that preserves these paths · no repository service required</text>
</svg>