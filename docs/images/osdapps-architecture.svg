<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">OSDApps end-to-end architecture</title>
<desc id="desc">Repository apps are synchronized in WinPE, built-in apps are refreshed in full Windows, then all apps are installed by the runner in one ordered queue before OOBE.</desc>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.t{font-size:18px;font-weight:600}.s{font-size:15px}.phase{font-size:17px;font-weight:700;fill:#fff}.arrow{stroke:#4a5a73;stroke-width:3;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#9fb1c8;stroke-width:2}.accent{fill:#233b5f}.soft{fill:#eef4fa;stroke:#9fb1c8;stroke-width:2}.repo{fill:#f4f7fb;stroke:#6b83a3;stroke-width:2}.built{fill:#eef7f2;stroke:#6a9a7d;stroke-width:2}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a5a73"/></marker></defs>
<text x="600" y="42" text-anchor="middle" class="h">OSDApps end-to-end architecture</text>
<rect x="55" y="80" width="1090" height="55" rx="10" class="accent"/><text x="600" y="115" text-anchor="middle" class="phase">WINPE · repository sync, cache and deployment intent</text>
<rect x="90" y="175" width="300" height="120" rx="12" class="repo"/><text x="240" y="207" text-anchor="middle" class="t">Self-maintained repository</text><text x="240" y="238" text-anchor="middle" class="s">catalog.json + manifests</text><text x="240" y="263" text-anchor="middle" class="s">Package.zip controlled by you</text>
<rect x="450" y="175" width="300" height="120" rx="12" class="built"/><text x="600" y="207" text-anchor="middle" class="t">Built-in applications</text><text x="600" y="238" text-anchor="middle" class="s">Vendor sources are defined</text><text x="600" y="263" text-anchor="middle" class="s">Intent is staged in WinPE</text>
<rect x="810" y="175" width="300" height="120" rx="12" class="soft"/><text x="960" y="207" text-anchor="middle" class="t">OSDCloud USB cache</text><text x="960" y="238" text-anchor="middle" class="s">Optional, persistent cache</text><text x="960" y="263" text-anchor="middle" class="s">Repository apps updated in WinPE</text>
<path d="M390 235 H450" class="arrow"/><path d="M750 235 H810" class="arrow"/>
<rect x="370" y="330" width="460" height="95" rx="12" class="box"/><text x="600" y="363" text-anchor="middle" class="t">DeviceManifest.json</text><text x="600" y="392" text-anchor="middle" class="s">One ordered Apps[] queue · repository + built-ins</text>
<path d="M240 295 C240 355 330 375 370 375" class="arrow"/><path d="M600 295 V330" class="arrow"/><path d="M960 295 C960 355 870 375 830 375" class="arrow"/>
<rect x="55" y="455" width="1090" height="55" rx="10" class="accent"/><text x="600" y="490" text-anchor="middle" class="phase">FULL WINDOWS · built-in refresh, local staging and installation</text>
<rect x="90" y="545" width="290" height="105" rx="12" class="built"/><text x="235" y="578" text-anchor="middle" class="t">PreInstall</text><text x="235" y="608" text-anchor="middle" class="s">Refresh built-ins from vendor</text><text x="235" y="633" text-anchor="middle" class="s">Update USB cache + OS staging</text>
<rect x="455" y="545" width="290" height="105" rx="12" class="box"/><text x="600" y="578" text-anchor="middle" class="t">Runner</text><text x="600" y="608" text-anchor="middle" class="s">Validate + install Apps[]</text><text x="600" y="633" text-anchor="middle" class="s">Exact Add-* order</text>
<rect x="820" y="545" width="290" height="105" rx="12" class="soft"/><text x="965" y="578" text-anchor="middle" class="t">OOBE / Autopilot</text><text x="965" y="608" text-anchor="middle" class="s">Continues after successful</text><text x="965" y="633" text-anchor="middle" class="s">SetupComplete execution</text>
<path d="M600 425 V455" class="arrow"/><path d="M600 510 C600 528 235 520 235 545" class="arrow"/><path d="M380 598 H455" class="arrow"/><path d="M745 598 H820" class="arrow"/>
</svg>